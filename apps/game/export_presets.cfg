html/head_include="<style>
#uc-rotate{display:none;position:fixed;inset:0;z-index:2147483647;background:radial-gradient(circle at 50% 40%,#1d3358,#0d1626 70%);color:#f5efe3;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;user-select:none}
@media (orientation:portrait) and (pointer:coarse){#uc-rotate{display:flex}}
#uc-rotate .uc-phone{width:56px;height:96px;border:5px solid #e6b85c;border-radius:12px;position:relative;animation:uc-turn 2.2s ease-in-out infinite}
#uc-rotate .uc-phone:after{content:'';position:absolute;bottom:6px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#e6b85c}
@keyframes uc-turn{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#uc-rotate h1{margin:6px 0 0;font-size:24px;font-weight:800;color:#ffd38a}
#uc-rotate p{margin:0;font-size:15px;opacity:.85;max-width:300px;line-height:1.4}
#uc-rotate button{margin-top:6px;padding:12px 22px;border:1px solid #6e2c10;border-bottom-width:4px;border-radius:10px;background:#e2703a;color:#fff;font-size:16px;font-weight:800}
</style>
<script>
(function(){
  function lock(){
    var el=document.documentElement;
    var req=el.requestFullscreen||el.webkitRequestFullscreen;
    var p=req?req.call(el):null;
    Promise.resolve(p).then(function(){
      if(screen.orientation&&screen.orientation.lock){return screen.orientation.lock('landscape');}
    }).catch(function(){});
  }
  function build(){
    if(document.getElementById('uc-rotate')){return;}
    var d=document.createElement('div');
    d.id='uc-rotate';
    d.innerHTML='<div class=\"uc-phone\"></div><h1>Gira tu dispositivo</h1><p>UrbanCraft se juega en horizontal.</p>';
    var el=document.documentElement;
    if((el.requestFullscreen||el.webkitRequestFullscreen)&&screen.orientation&&screen.orientation.lock){
      var b=document.createElement('button');
      b.textContent='Jugar en pantalla completa';
      b.addEventListener('click',lock);
      d.appendChild(b);
    }
    document.body.appendChild(d);
  }
  if(document.body){build();}else{document.addEventListener('DOMContentLoaded',build);}
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
